worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format json_log escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_log;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2M;

    # ── Rate limiting zones ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Upstream ─────────────────────────────────────────────
    upstream wanderai_api {
        server api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (second layer after Flask middleware)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ── Auth endpoints — stricter rate limit ──────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://wanderai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── API endpoints ────────────────────────────────────
        location /api/ {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass http://wanderai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Static files ─────────────────────────────────────
        location /static/ {
            proxy_pass http://wanderai_api;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── All other requests ────────────────────────────────
        location / {
            proxy_pass http://wanderai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
