name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Security scan with bandit
        run: bandit -r wanderai/ -ll

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wanderai_test
          POSTGRES_USER: wanderai
          POSTGRES_PASSWORD: wanderai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wanderai -d wanderai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://wanderai:wanderai@localhost:5432/wanderai_test
          REDIS_URL: redis://localhost:6379/0
          FLASK_SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-key
          WATSONX_API_KEY: test-key
          WATSONX_PROJECT_ID: test-project
        run: |
          pytest tests/ \
            --cov=wanderai \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wanderai:${{ github.sha }} .

      - name: Test image health
        run: |
          docker run -d --name test_container \
            -e FLASK_ENV=development \
            -e FLASK_SECRET_KEY=test \
            -e DATABASE_URL=sqlite:///test.db \
            -p 5000:5000 \
            wanderai:${{ github.sha }}
          timeout 60 bash -c 'until curl -f -s http://localhost:5000/api/v1/health > /dev/null; do sleep 2; done' || (docker logs test_container && exit 1)
          docker stop test_container
